# =============================================================================
# Bonde Backend - local development & orchestration
# -----------------------------------------------------------------------------
# Runs the NestJS API together with the Redis dependency.
#
# NOTE: PostgreSQL is managed by Supabase (remote project or local `supabase
# start`), so it is NOT defined here. Point DATABASE_URL / DIRECT_URL at your
# Supabase Postgres instance and run migrations via Prisma.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: bonde-backend-api
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.PORT||3001)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bonde-backend-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
