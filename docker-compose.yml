# =============================================================================
# Bonde Backend - local development & orchestration
# -----------------------------------------------------------------------------
# Runs the NestJS API together with Redis and a local PostgreSQL.
#
# The deployed/runtime Postgres is hosted by Supabase — point DATABASE_URL /
# DIRECT_URL there for `pnpm start:dev`. The `postgres` service here exists for
# DB-backed e2e tests (`pnpm test:e2e` / `pnpm check`): the Vitest global
# setup migrates and seeds this local instance (port 5433) and the e2e specs
# point their Prisma client at it.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: bonde-backend-api
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.PORT||3001)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bonde-backend-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: bonde-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Luc4$d3nn1$
      POSTGRES_DB: bonde
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bonde']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
