# =============================================================================
# Bonde Backend - CI
# -----------------------------------------------------------------------------
# Quality gate: format, lint, unit, e2e, build. Every job is required; the
# `check` gate summarises them so branch protection can require a single status.
#
# e2e runs against service containers (Postgres + Redis) with the credentials
# from `test/db.ts` (TEST_DB_URL). All cloud providers (Supabase/Resend/Termii)
# are mocked or overridden by the e2e harness, so the top-level env only needs
# inert values that satisfy the Joi boot schema (src/config/env.validation.ts).
# =============================================================================

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # --- Joi boot validation (src/config/env.validation.ts) -------------------
  # e2e mocks JWKS verification + OTP/mail senders, so these are placeholders.
  SUPABASE_URL: http://localhost:54321
  SUPABASE_ANON_KEY: anon-key-placeholder
  SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
  AUTH_TOKEN_SECRET: dummy-auth-token-secret-32-chars
  RESEND_API_KEY: re_dummy
  TERMII_API_KEY: termii-dummy
  CARD_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  REDIS_URL: redis://localhost:6379
  # --- Postgres used by e2e (matches test/db.ts TEST_DB_URL) ----------------
  TEST_DATABASE_URL: postgresql://bonde:bonde@localhost:5433/bonde
  # prisma.config.ts uses env('DIRECT_URL') for prisma generate; no .env in CI.
  DIRECT_URL: postgresql://bonde:bonde@localhost:5433/bonde
  # ConfigModule validates process.env at app.module import time (before
  # bootE2EApp re-points it at TEST_DB_URL) — no .env in CI, so supply it.
  DATABASE_URL: postgresql://bonde:bonde@localhost:5433/bonde

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  env-tools:
    name: Environment sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/env-vercel.test.mjs scripts/db-migration.test.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm typecheck
      - run: pnpm test:workers
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bonde
          POSTGRES_PASSWORD: bonde
          POSTGRES_DB: bonde
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bonde -d bonde"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm test:e2e
      - run: pnpm db:migration:check

  check:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [format, lint, unit, build, e2e, env-tools]
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if(Object.values(JSON.parse(process.env.RESULTS)).some(j=>j.result!=="success"))process.exit(1)'

  deploy:
    name: Deploy checked commit
    if: github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'main')
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      BONDE_ENV_JSON: ${{ secrets.BONDE_ENV_JSON }}
      BONDE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BONDE_DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BONDE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BONDE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      BONDE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm this is still the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
      - name: Validate selected environment before any remote mutation
        run: |
          test -n "$BONDE_ENV_JSON"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ORG_ID"
          target=preview
          if [ "$GITHUB_REF_NAME" = main ]; then target=production; fi
          echo "BONDE_TARGET=$target" >> "$GITHUB_ENV"
          node scripts/env-vercel.mjs prepare --environment "$target"
      - name: Install deployment CLI
        run: npm install --global vercel@65.9.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm prisma:generate
      - name: Sync only nonempty selected environment values
        run: node scripts/env-vercel.mjs push --environment "$BONDE_TARGET" --deployment --file .env.vercel.json
      - name: Keep the private manifest outside deployment source
        run: |
          prepared="$RUNNER_TEMP/bonde-prepared-env.json"
          mv .env.vercel.json "$prepared"
          echo "BONDE_PREPARED_ENV_FILE=$prepared" >> "$GITHUB_ENV"
      - name: Build the actual deployment before database migration
        run: |
          vercel pull --yes --environment="$BONDE_TARGET" --token="$VERCEL_TOKEN"
          if [ "$BONDE_TARGET" = production ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Apply only this environment's migrations after all checks and build
        run: pnpm db:migrate:deploy --environment "$BONDE_TARGET"
      - name: Stage deployment without promoting production domains
        run: |
          if [ "$BONDE_TARGET" = production ]; then
            vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          else
            vercel deploy --prebuilt --yes --meta githubCommitRef=staging --token="$VERCEL_TOKEN" > deployment-url.txt
          fi
          url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' deployment-url.txt | tail -1)
          test -n "$url"
          echo "BONDE_DEPLOYMENT_URL=$url" >> "$GITHUB_ENV"
      - name: Wait for deployment readiness
        run: vercel inspect "$BONDE_DEPLOYMENT_URL" --wait --token="$VERCEL_TOKEN"
      - name: Smoke test before alias or promotion
        run: vercel curl /api/health --deployment "$BONDE_DEPLOYMENT_URL" --token="$VERCEL_TOKEN" -- --fail --silent --show-error
      - name: Publish checked deployment
        env:
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
          if [ "$BONDE_TARGET" = production ]; then
            vercel promote "$BONDE_DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
          elif [ -n "$STAGING_DOMAIN" ]; then
            vercel alias set "$BONDE_DEPLOYMENT_URL" "$STAGING_DOMAIN" --token="$VERCEL_TOKEN"
          fi
